<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フォトリスク - テスト</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic&family=WDXL+Lubrifont+JP+N&display=swap"
          rel="stylesheet">

    <style>
        body {
            background-color: #bee0c2;
            font-family: 'BIZ UDPGothic', sans-serif;
        }

        .site-header {
            background-color: #618e34;
        }

        .site-title {
            color: #bde695;
            font-family: 'WDXL Lubrifont JP N', sans-serif;
            font-size: 32px;
        }

        .content-card {
            background-color: #FFF8E7;
        }

        .main-color {
            color: #286B70;
        }

        .btn-main {
            background-color: #286B70;
            color: #FFF8E7;
        }

        .btn-main:hover {
            background-color: #1d5155;
            color: #FFF8E7;
        }

        .btn-main:disabled {
            background-color: #286B70;
            color: #FFF8E7;
            opacity: 0.5;
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <header class="site-header p-3">
        <span class="site-title">フォトリスク</span>
    </header>

    <main class="container py-4">

        <!-- テスト名 -->
        <h1 class="h3 fw-bold main-color mb-4"
            th:text="${testType == 'post' ? '利用後テスト' : '利用前テスト'}">
            利用前テスト
        </h1>

        <!-- 問題文・問題番号 -->
        <section class="content-card rounded-3 p-4 shadow-sm mb-4">

            <div class="d-flex justify-content-between
                        align-items-center flex-wrap gap-2 mb-3">

                <h2 class="h5 fw-bold main-color mb-0">
                    問題
                </h2>

                <span class="fw-bold"
                      th:text="|第${questionNumber}問／全5問|">
                    第1問／全5問
                </span>

            </div>

            <p class="mb-0"
               th:text="${questionText}">
                下記の写真がAIによってどこまで特定できるか
            </p>

        </section>

        <div class="row g-4">

            <!-- 問題画像 -->
            <section class="col-12 col-md-7">

                <div class="content-card rounded-3 p-4 h-100 shadow-sm">

                    <h2 class="h5 fw-bold main-color mb-3">
                        問題画像
                    </h2>

                    <img th:if="${imageUrl != null}"
                         th:src="${imageUrl}"
                         alt="問題画像"
                         class="img-fluid rounded d-block mx-auto"
                         style="max-height: 400px; object-fit: contain;">

                    <p th:unless="${imageUrl != null}"
                       class="text-secondary mb-0">
                        問題画像がありません。
                    </p>

                </div>

            </section>

            <!-- 回答欄 -->
            <section class="col-12 col-md-5">

                <div class="content-card rounded-3 p-4 h-100 shadow-sm">

                    <h2 class="h5 fw-bold main-color mb-4">
                        回答欄
                    </h2>

                    <form th:action="${testType == 'post'}
                                      ? @{/quiz/post/answer}
                                      : @{/quiz/pre/answer}"
                          method="post">

                        <!-- 選択肢 -->
                        <div class="d-flex flex-column gap-4">

                            <div class="form-check">
                                <input class="form-check-input"
                                       type="radio"
                                       name="answer"
                                       id="answer1"
                                       value="1"
                                       required>

                                <label class="form-check-label"
                                       for="answer1">
                                    地区まで特定できる
                                </label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input"
                                       type="radio"
                                       name="answer"
                                       id="answer2"
                                       value="2"
                                       required>

                                <label class="form-check-label"
                                       for="answer2">
                                    市町村まで特定できる
                                </label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input"
                                       type="radio"
                                       name="answer"
                                       id="answer3"
                                       value="3"
                                       required>

                                <label class="form-check-label"
                                       for="answer3">
                                    県まで特定できる
                                </label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input"
                                       type="radio"
                                       name="answer"
                                       id="answer4"
                                       value="4"
                                       required>

                                <label class="form-check-label"
                                       for="answer4">
                                    特定できない
                                </label>
                            </div>

                        </div>

                        <!-- 解答ボタン -->
                        <div class="text-center mt-5">

                            <button type="submit"
                                    id="answerButton"
                                    class="btn btn-main px-5 py-2"
                                    disabled>
                                解答
                            </button>

                        </div>

                    </form>

                </div>

            </section>

        </div>

    </main>

    <!-- 選択肢に応じた解答ボタンの活性化 -->
    <script>
        const answers = document.querySelectorAll('input[name="answer"]');
        const answerButton = document.getElementById('answerButton');

        answers.forEach(answer => {
            answer.addEventListener('change', () => {
                answerButton.disabled = false;
            });
        });
    </script>

</body>
</html>
