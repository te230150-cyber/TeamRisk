<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フォトリスク - 学習・評価モード</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic&family=WDXL+Lubrifont+JP+N&display=swap"
        rel="stylesheet">

    <style>
        body {
            background-color: #bee0c2;
            font-family: 'BIZ UDPGothic', sans-serif;
        }

        .site-header {
            background-color: #618e34;
        }

        .site-title {
            color: #bde695;
            font-family: 'WDXL Lubrifont JP N', sans-serif;
            font-size: 32px;
        }

        .content-card {
            background-color: #FFF8E7;
        }

        .main-color {
            color: #286B70;
        }

        .btn-main {
            background-color: #286B70;
            color: #FFF8E7;
        }

        .btn-main:hover {
            background-color: #1d5155;
            color: #FFF8E7;
        }

        .step-number {
            background-color: #286B70;
            color: #FFF8E7;
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <header class="site-header p-3">
        <span class="site-title">フォトリスク</span>
    </header>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-9">

                <!-- タイトル -->
                <h1 class="h2 fw-bold main-color text-center mb-4">
                    学習・評価モード
                </h1>

                <!-- 説明文 -->
                <p class="text-center mb-4">
                    画像から撮影場所が特定されるリスクについて学習します。
                </p>

                <!-- 学習の流れ -->
                <section class="content-card rounded-3 p-4 shadow-sm">

                    <h2 class="h5 fw-bold main-color mb-4">
                        学習の流れ
                    </h2>

                    <div class="d-flex flex-column gap-4">

                        <!-- 利用前テスト -->
                        <div class="d-flex align-items-start gap-3">

                            <span class="step-number rounded-circle
                                         px-3 py-2 fw-bold">
                                1
                            </span>

                            <div>
                                <h3 class="h6 fw-bold">
                                    利用前テスト
                                </h3>

                                <p class="mb-0">
                                    画像の位置特定リスクに関する問題に
                                    5問回答します。
                                </p>
                            </div>

                        </div>

                        <!-- 画像診断 -->
                        <div class="d-flex align-items-start gap-3">

                            <span class="step-number rounded-circle
                                         px-3 py-2 fw-bold">
                                2
                            </span>

                            <div>
                                <h3 class="h6 fw-bold">
                                    画像診断
                                </h3>

                                <p class="mb-0">
                                    診断結果からどのようなリスクが
                                    あるのかを学びます。
                                </p>
                            </div>

                        </div>

                        <!-- 利用後テスト -->
                        <div class="d-flex align-items-start gap-3">

                            <span class="step-number rounded-circle
                                         px-3 py-2 fw-bold">
                                3
                            </span>

                            <div>
                                <h3 class="h6 fw-bold">
                                    利用後テスト
                                </h3>

                                <p class="mb-0">
                                    診断で学んだことを踏まえて、
                                    再度5問の問題に回答します。
                                </p>
                            </div>

                        </div>

                        <!-- 学習結果の確認 -->
                        <div class="d-flex align-items-start gap-3">

                            <span class="step-number rounded-circle
                                         px-3 py-2 fw-bold">
                                4
                            </span>

                            <div>
                                <h3 class="h6 fw-bold">
                                    学習結果の確認
                                </h3>

                                <p class="mb-0">
                                    利用前後のテスト結果から
                                    理解度の変化を確認します。
                                </p>
                            </div>

                        </div>

                    </div>
                </section>

                <!-- 注意事項 -->
                <p class="text-center mt-4 mb-4 small">
                    ※テストでは、現在のご自身の知識や判断に基づいて
                    回答してください。
                </p>

                <!-- 操作ボタン -->
                <div class="d-flex justify-content-center
                            flex-wrap gap-4 mt-4">

                    <a th:href="@{/}" class="btn btn-outline-success px-5 py-2">
                        戻る
                    </a>

                    <a th:href="@{/quiz/pre}" class="btn btn-main px-5 py-2">
                        テスト開始
                    </a>

                </div>

            </div>
        </div>
    </main>

</body>

</html>
