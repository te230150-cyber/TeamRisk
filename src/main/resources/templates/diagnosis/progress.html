<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>診断中 | フォトリスク</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="m-0">

    <!-- ヘッダー -->
    <header class="bg-success px-4 py-3">
        <h1 class="fs-2 fw-bold text-white m-0">
            フォトリスク
        </h1>
    </header>

    <!-- 診断中画面 -->
    <main class="d-flex flex-column align-items-center
                 justify-content-center min-vh-100 gap-4"
          style="background-color: #c2e0c6;">

        <!-- 画像表示エリア -->
        <div class="d-flex align-items-center justify-content-center
                    rounded-3"
             style="width: 350px; height: 300px;
                    background-color: #fff8e8;">

            <span class="fs-4 fw-bold">
                診断中
            </span>

        </div>

        <!-- ローディングスピナー -->
        <div class="spinner-border text-success"
             role="status"
             style="width: 3rem; height: 3rem;">

            <span class="visually-hidden">診断中...</span>

        </div>

        <p class="fs-5 fw-bold text-success">
            画像を診断しています...
        </p>

    </main>

</body>
</html>
