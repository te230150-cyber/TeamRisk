<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フォトリスク - トップ画面</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

          <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic&family=WDXL+Lubrifont+JP+N&display=swap" rel="stylesheet">
    
</head>

<body style="background-color:#bee0c2">
    

    <!-- ヘッダー -->
    <header class="bg-subtle p-3" style="background-color: #618e34;">
        <span class="fw-bold" style="color: #bde695; font-family: WDXL Lubrifont JP N, sans-serif; font-weight: 400; font-style: normal; font-size: 32px;">フォトリスク</span>
    </header>

    <!-- メイン -->
    <main class="container min-vh-100 d-flex justify-content-center align-items-center">

        <div class="d-flex justify-content-center gap-5">

            <!-- 通常診断モード -->
            <a th:href="@{/diagnosis/upload}"
               class="btn d-flex justify-content-center align-items-center p-5" 
               style="background-color: #FFF8E7;
               font-family: BIZ UDPGothic, sans-serif;
               font-weight: 400;font-style: normal;
               font-size: 32px;
               color: #286B70;
               ">
                通常診断モード
            </a>

            <!-- 学習・評価モード -->
            <a th:href="@{/quiz}"
               class="btn  d-flex justify-content-center align-items-center p-5"
               style="background-color: #286B70;
               font-family: BIZ UDPGothic, sans-serif;
               font-weight: 400;font-style: normal;
               font-size: 32px;
               color: #FFF8E7;
               ">
                学習・評価モード
            </a>

        </div>

    </main>

</body>
</html>
